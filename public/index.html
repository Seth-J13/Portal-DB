<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aperture Records</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Enrichment Center</p>
          <h1>Aperture Records</h1>
        </div>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </header>
    <div class="shell">
      <nav id="nav" aria-label="Tables"></nav>
      <main id="main"></main>
    </div>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
